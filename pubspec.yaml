name: offline_course_schedule
description: 完全离线的个人课程表（当前阶段：数据、导入与周次判定）
publish_to: none
version: 0.3.2+17

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  tj_ios_bridge:
    path: packages/tj_ios_bridge
  canvas_session_bridge:
    path: packages/canvas_session_bridge
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  android_intent_plus: ^6.1.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.0.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.4
  flutter_timezone: ^5.1.0
  tj_text_recognition:
    path: packages/tj_text_recognition
  path: ^1.9.0
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  sqflite: ^2.3.3+1
  timezone: ^0.11.1
  webview_flutter: ^4.14.1
  workmanager: 0.10.10
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: 2.3.4+4
  sqlite3: 2.9.4
  webview_flutter_platform_interface: ^2.15.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/LICENSE_HITable.txt
    - assets/task_collector.js
